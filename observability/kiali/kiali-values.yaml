auth:
  strategy: token        # Kiali login, can also use anonymous or token
  #username: admin        # default username
  #passphrase: strongpassword      # default password (change in production)

deployment:
  replicas: 1
  namespace: istio-system

external_services:
  prometheus:
    url: http://prometheus-operated.monitoring.svc:9090
  grafana:
    url: http://grafana.monitoring.svc:3000
  tracing:
    url: http://jaeger-query.observability.svc:16686  

istio_component_namespaces:
  istio_namespace: istio-system

server:
  port: 20001
