auth:
  strategy: token

deployment:
  replicas: 1
  namespace: istio-system

external_services:
  prometheus:
    external_url: http://prometheus-server.monitoring.svc.cluster.local:80
  grafana:
    external_url: http://grafana.monitoring.svc.cluster.local:80
  tracing:
    external_url: http://jaeger-query.observability.svc.cluster.local:16686


istio_component_namespaces:
  istio_namespace: istio-system

server:
  port: 20001
